steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_IMAGE}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=DATA_BACKEND=firestore'
images:
  - '${_IMAGE}'
substitutions:
  _SERVICE: ai-lecture-live
  _REGION: asia-northeast3
  _IMAGE: asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-lecture-live:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
